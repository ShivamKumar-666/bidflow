# Render Blueprint — Infrastructure as Code for BidFlow
# Deploy: https://render.com/docs/blueprint-spec
#
# Prerequisites:
# - MongoDB Atlas cluster (free tier)
# - Atlas connection string set as RENDER_MONGO_URI secret

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: bidflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard (Atlas URI)
      # SECRET_KEY / JWT_SECRET_KEY / EMAIL_TOKEN_SECRET come from the shared
      # group below. They MUST match across backend + celery: the worker signs
      # retrained ML models with SECRET_KEY (HMAC) and the backend verifies them.
      - fromGroup: bidflow-secrets
      - key: FRONTEND_URL
        sync: false  # Set to your frontend URL after deployment
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set to your frontend URL after deployment
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_DEFAULT_SENDER
        sync: false  # Set to your sender email in Render dashboard
      # Set these in Render dashboard:
      # MAIL_USERNAME
      # MAIL_PASSWORD
      # GOOGLE_CLIENT_ID (optional)
      - key: REDIS_URL
        sync: false  # Set to rediss://... (TLS required for Upstash)

  # ── Celery Worker (Background Tasks) ────────────────────────────────────────
  - type: worker
    name: bidflow-celery
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A celery_app.celery worker --beat --loglevel=info
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Same as backend
      - key: REDIS_URL
        sync: false  # Set to rediss://... (TLS required for Upstash)
      # Same shared secrets as the backend (see note above) — critical so the
      # worker-signed model binaries verify against the backend's SECRET_KEY.
      - fromGroup: bidflow-secrets

  # ── Frontend (Static Site) ──────────────────────────────────────────────────
  - type: static_site
    name: bidflow-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Set to your backend URL after deployment
      - key: VITE_SOCKET_URL
        sync: false  # Set to your backend URL after deployment
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false  # Set to your Google OAuth Client ID (optional)

# ── Shared secrets ────────────────────────────────────────────────────────────
# Generated once and shared by backend + celery so JWT verification and ML model
# HMAC signatures are consistent across every service.
envVarGroups:
  - name: bidflow-secrets
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMAIL_TOKEN_SECRET
        generateValue: true
