# Render Blueprint — Infrastructure as Code for BidFlow
# Deploy: https://render.com/docs/blueprint-spec
#
# Prerequisites:
# - MongoDB Atlas cluster (free tier)
# - Atlas connection string set as RENDER_MONGO_URI secret

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: bidflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard (Atlas URI)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMAIL_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set to your frontend URL after deployment
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set to your frontend URL after deployment
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      # Set these in Render dashboard:
      # MAIL_USERNAME
      # MAIL_PASSWORD
      # MAIL_DEFAULT_SENDER
      # GOOGLE_CLIENT_ID (optional)

  # ── Celery Worker (Background Tasks) ────────────────────────────────────────
  - type: worker
    name: bidflow-celery
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A celery_app.celery worker --beat --loglevel=info
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Same as backend

  # ── Frontend (Static Site) ──────────────────────────────────────────────────
  - type: static_site
    name: bidflow-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Set to your backend URL after deployment
