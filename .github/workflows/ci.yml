name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libxml2-dev libxslt1-dev
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      
      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on
        working-directory: backend
        continue-on-error: true
      
      - name: Run tests with coverage
        env:
          FLASK_ENV: testing
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DB: bidflow_test
          JWT_SECRET_KEY: test-jwt-secret
          SECRET_KEY: test-secret-key
          EMAIL_TOKEN_SECRET: test-email-secret
        run: |
          pytest --cov=routes --cov-report=xml --cov-report=term-missing
        working-directory: backend
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
      
      - name: Run linter
        run: npm run lint
        working-directory: frontend
      
      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: bidflow-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: bidflow-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
